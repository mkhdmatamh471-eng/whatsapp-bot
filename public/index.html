<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المستشار العقاري الآلي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; }
        .chat-container { max-height: 60vh; overflow-y: auto; }
        .bot-msg { background-color: #ffffff; border-radius: 15px 15px 0 15px; }
        .user-msg { background-color: #d9fdd3; border-radius: 15px 15px 15px 0; }
    </style>
</head>
<body class="flex flex-col h-screen">

    <!-- Header -->
    <header class="bg-teal-700 text-white p-4 shadow-md flex justify-between items-center">
        <div class="flex items-center gap-3">
            <i class="fas fa-robot text-2xl"></i>
            <h1 class="text-xl font-bold">محاكي البوت العقاري</h1>
        </div>
        <div class="flex items-center gap-4">
            <span id="ai-status-badge" class="px-3 py-1 rounded-full text-sm font-semibold bg-gray-500">جاري التحقق...</span>
            <a href="/admin.html" class="bg-teal-900 hover:bg-teal-800 px-4 py-2 rounded text-sm transition">لوحة التحكم</a>
        </div>
    </header>

    <!-- Chat Area -->
    <main class="flex-1 max-w-3xl w-full mx-auto p-4 flex flex-col">
        <div id="chat-box" class="chat-container flex-1 bg-[#efeae2] p-4 rounded-lg shadow-inner mb-4 flex flex-col gap-3">
            <div class="text-center text-gray-500 text-sm my-2">تنويه: هذه واجهة تجريبية لمحاكاة ردود الذكاء الاصطناعي</div>
            <!-- Messages will appear here -->
        </div>

        <!-- Input Area -->
        <div class="flex gap-2 bg-white p-2 rounded-lg shadow">
            <button onclick="resetChat()" class="text-gray-500 hover:text-red-500 p-3" title="مسح الذاكرة">
                <i class="fas fa-trash"></i>
            </button>
            <input type="text" id="chat-input" class="flex-1 outline-none px-2" placeholder="اكتب رسالتك هنا..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()" class="bg-teal-600 hover:bg-teal-700 text-white p-3 rounded-full w-12 h-12 flex items-center justify-center transition">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const chatBox = document.getElementById('chat-box');
        const inputField = document.getElementById('chat-input');
        const aiStatusBadge = document.getElementById('ai-status-badge');

        socket.on('ai-status', (data) => {
            if (data.active) {
                aiStatusBadge.textContent = 'البوت نشط';
                aiStatusBadge.className = 'px-3 py-1 rounded-full text-sm font-semibold bg-green-500';
            } else {
                aiStatusBadge.textContent = 'البوت معطل';
                aiStatusBadge.className = 'px-3 py-1 rounded-full text-sm font-semibold bg-red-500';
            }
        });

        function appendMessage(sender, text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `max-w-[80%] p-3 shadow-sm ${sender === 'user' ? 'user-msg self-end' : 'bot-msg self-start'}`;
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            const text = inputField.value.trim();
            if (!text) return;

            appendMessage('user', text);
            inputField.value = '';

            try {
                const response = await fetch('/api/test-chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await response.json();
                appendMessage('bot', data.reply);
            } catch (err) {
                appendMessage('bot', '⚠️ حدث خطأ في الاتصال بالسيرفر.');
            }
        }

        async function resetChat() {
            if(confirm('هل أنت متأكد من مسح ذاكرة المحادثة؟')) {
                await fetch('/api/test-chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ reset: true })
                });
                chatBox.innerHTML = '<div class="text-center text-gray-500 text-sm my-2">تم مسح ذاكرة المحادثة</div>';
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>
